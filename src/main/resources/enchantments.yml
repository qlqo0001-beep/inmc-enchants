  type: ATTACK;ATTACK_MOB
  group: LEGENDARY
  applies:
    - ALL_SWORD
  settings:
    required-enchants:
      - 'drain:7'
    removed-enchants:
      - 'drain'
  levels:
    '1':
      cooldown: 5.5
      effects:
        - 'STEAL_HEALTH:1.5 @Victim'
    '2':
      cooldown: 5
      effects:
        - 'STEAL_HEALTH:2 @Victim'
    '3':
      cooldown: 4.5
      effects:
        - 'STEAL_HEALTH:2.5 @Victim'
    '4':
      cooldown: 4
      effects:
        - 'STEAL_HEALTH:3 @Victim'
    '5':
      cooldown: 3.5
      effects:
        - 'STEAL_HEALTH:3.5 @Victim'

