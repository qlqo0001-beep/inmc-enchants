# 커스텀 인첸트 정의. /인첸트 관리 에서 GUI 로 만들고 고치는 것을 권장합니다.
# 문법은 AdvancedEnchantments 와 같습니다 - AE 의 enchantments.yml 을 그대로 붙여 넣어도 읽힙니다.
