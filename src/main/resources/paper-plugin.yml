name: inmc-enchants
version: '${version}'
main: com.inmc.enchants.EnchantsPlugin
api-version: '${apiVersion}'   # build.gradle.kts 의 inmc { paper } 에서 유도됨
description: 커스텀 인첸트 - 부여서·스크롤·가루·인챈터·효과 엔진
authors: [ INMC ]

# 연동은 전부 load: OMIT 이다. BEFORE 를 걸면 Paper 가 의존성 순환을 보고 우리 간선을
# 조용히 끊는다 (가이드 함정 1).
dependencies:
  server:
    # 필수 의존은 이것 하나뿐. core 가 kotlin-stdlib 과 공용 프레임워크를 들고 있다.
    inmc-core:        { load: BEFORE, required: true,  join-classpath: true }
    PlaceholderAPI:   { load: OMIT,   required: false, join-classpath: true }
    Vault:            { load: OMIT,   required: false, join-classpath: true }

# commands 절은 paper-plugin.yml 에 없다 - Brigadier 로 등록한다.
permissions:
  inmcenchant.use:
    description: 인첸트 허브·목록·정보·인챈터·팅커러·알케미스트·GKit·세트
    default: true
  inmcenchant.admin:
    description: 인첸트 관리 전체 (편집기·지급·검증·리로드)
    default: op
    children:
      inmcenchant.use: true
      inmcenchant.enchant: true
      inmcenchant.enchant.others: true
  inmcenchant.enchant:
    description: /인첸트 부여·해제 - 손에 든 아이템에 커스텀·바닐라 인첸트를 바로 붙이고 떼기 (바닐라는 레벨 한도 안에서)
    default: op
  inmcenchant.enchant.others:
    description: /인첸트 부여·해제 를 다른 플레이어의 손에 든 아이템에
    default: op
  inmcenchant.vanilla.bypass:
    description: /인첸트 부여 의 바닐라 레벨 한도(scrolls.yml vanilla-max-level · inmcenchant.vanilla.<인첸트>.<레벨>)를 무시한다(255 까지)
    default: false
  # inmcenchant.vanilla.<인첸트>.<레벨> (예: inmcenchant.vanilla.sharpness.10) 은 인첸트·레벨마다라 여기 다 적을 수 없다.
  # 그래서 명령은 "명시적으로 준 노드"(effectivePermissions)만 센다 - 선언 안 된 노드가 OP 에게 전부 참인 함정(지뢰 11)을 피한다.
  inmcenchant.bypass.souls:
    description: 인첸트의 영혼 비용을 치르지 않는다
    default: false
  inmcenchant.bypass.cooldown:
    description: 인첸트 쿨다운을 무시한다
    default: false
