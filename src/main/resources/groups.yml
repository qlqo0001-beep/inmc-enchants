# 인첸트 등급. /인첸트 관리 의 "등급" 화면에서 바꿀 수 있습니다.
#  color            등급 색 (%group-color%)
#  order            귀한 정도. 로어 정렬과 인챈터 배치 순서
#  rgb              가루·확장기 아이템 색 (r,g,b)
#  slot-increaser   이 등급 확장기가 늘리는 칸
#  magic-dust       success = 마법 가루의 성공률 증가 범위, chance = 비밀 가루가 마법 가루로 열릴 확률(%)
#  enchanter-price  인챈터가 이 등급 미공개 부여서를 파는 값 (exp:점수 · level:레벨 · money:돈 · souls:영혼 · item:재질:개수)
groups:
  SIMPLE:
    name: 일반
    color: "&7"
    order: 1
    rgb: 200,200,200
    slot-increaser: 1
    magic-dust: { success: 1-15, chance: 22 }
    enchanter-price: "exp:400"
