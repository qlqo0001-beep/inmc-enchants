# 방어구 세트와 세트 무기.
# /인첸트 관리 → 세트·무기 에서 GUI 로 만들고 고치는 것을 권장합니다.
#
# 세트: 네 부위를 모두 입으면 events 가 돕니다. 입고 벗을 때 equipped / unequipped 를 알립니다.
#   material  LEATHER · CHAINMAIL · IRON · GOLDEN · COPPER · DIAMOND · NETHERITE (AE 의 GOLD · CHAIN 도 받습니다)
#   color     가죽일 때만. #RRGGBB
#   pieces    helmet · chestplate · leggings · boots — 이름·설명·모델 번호(custom-model-data)·숨김(flags)·인첸트
#   enchants  "id:레벨" 또는 "id:최소-최대"(줄 때마다 굴림). 바닐라·커스텀 인첸트 둘 다. AE 의 "id:%1-3%" 도 받습니다
#             이름이 같으면 커스텀이 먼저입니다(protection 은 커스텀 "가호"). 바닐라를 뜻하면 "minecraft:protection:4"
#
# 무기: 손에 들고 있으면 events 가 돕니다. require-set 을 적으면 그 세트를 다 입었을 때만.
#
# events 의 모양은 인첸트 레벨과 같습니다: 발동 조건 → chance · cooldown · conditions · effects.
# 효과 줄 문법도 인첸트와 같습니다(enchantments.yml 참고). EFFECT_STATIC 은 "입고 있는 동안".

